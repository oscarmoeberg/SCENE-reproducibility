name: SCENE_repro
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core runtime.
  - python=3.11
  - pip
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.4.1
  - anndata=0.12
  - scanpy=1.11
  - h5py=3.10

  # SCENE model/training dependencies.
  - pytorch=2.10
  - pytorch-lightning=2.6
  - torchmetrics=1.9
  - joblib=1.5

  # Analysis scripts.
  - statsmodels=0.14
  - tqdm=4.67
  - leidenalg
  - python-igraph
  - umap-learn=0.5.7
  - harmonypy

  # Figure notebooks and supplementary tables.
  - ipykernel
  - nbformat
  - matplotlib=3.10
  - adjusttext=1.3
  - seaborn=0.13
  - fastcluster=1.2.6
  - nbclient=0.10

  # Baseline/imputation dependency used by scripts that compare against scVI.
  - scvi-tools=1.2.2

  # Test runner for the included smoke tests.
  - pytest
