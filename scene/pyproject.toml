[build-system]
requires      = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name            = "scene"
version         = "0.1.0"
description     = "SCENE: single-cell embedding model (reproducibility package for the SCENE manuscript)"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"
authors         = [{ name = "Oscar Moberg", email = "oscarmberg@gmail.com" }]
dependencies = [
  "numpy>=1.26,<3.0",
  "joblib>=1.4,<2.0",
  "torch>=2.3,<3.0",
  "pytorch-lightning>=2.5,<3.0",
  "scikit-learn>=1.4,<2.0",
  "scipy>=1.13,<2.0"
]

[tool.setuptools]
packages = ["scene"]
package-dir = {"" = "."}
